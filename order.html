<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Order Page - Cy's Flowers Shop</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Karla:wght@400;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Cy's Flowers Shop</h1>
        <p>Make someone smile with beautiful flowers.</p>
    </header>

    <nav class="navbar">
        <ul class="nav">
            <li class="nav-item">
                <a class="nav-link" href="index.html">Home</a>
            </li>

            <li class="nav-item">
                <a class="nav-link active" href="order.html">
                    Order
                </a>
            </li>
        </ul>
    </nav>

    <main>

        <section id="order">
            <h2>Place Your Order</h2>

            <p>
                Fill out the form below to order your favorite flowers.
            </p>

            <form action="#" method="post">

                <label for="name">Full Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    class="form-control"
                    placeholder="Enter your full name"
                    required>

                <br>

                <label for="email">Email Address:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required>

                <br>

                <label for="phone">Phone Number:</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    class="form-control"
                    placeholder="Enter your phone number"
                    required>

                <br>

                <label for="flower">Choose Your Flowers:</label>
                <select
                    id="flower"
                    name="flower"
                    class="form-select"
                    required>

                    <option value="">Select a bouquet</option>
                    <option value="roses">Rose Bouquet</option>
                    <option value="tulips">Tulip Bouquet</option>
                    <option value="sunflowers">Sunflower Bouquet</option>
                    <option value="mixed">Mixed Flower Bouquet</option>

                </select>

                <br>

                <label for="quantity">Quantity:</label>
                <input
                    type="number"
                    id="quantity"
                    name="quantity"
                    class="form-control"
                    min="1"
                    max="20"
                    value="1"
                    required>

                <br>

                <label for="date">Delivery Date:</label>
                <input
                    type="date"
                    id="date"
                    name="date"
                    class="form-control"
                    required>

                <br>

                <label for="address">Delivery Address:</label>
                <textarea
                    id="address"
                    name="address"
                    class="form-control"
                    rows="3"
                    placeholder="Enter your complete address"
                    required></textarea>

                <br>

                <label for="message">Special Message:</label>
                <textarea
                    id="message"
                    name="message"
                    class="form-control"
                    rows="3"
                    placeholder="Write a message for your loved one"></textarea>

                <br>

                <button type="submit" class="btn order-button">
                    Submit Order
                </button>

                <button type="reset" class="btn reset-button">
                    Clear Form
                </button>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Cy's Flowers Shop. All rights reserved.</p>
    </footer>

</body>

</html>
